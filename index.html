<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthy Time | إدارة بطاقات السعرات</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1 id="brandHeader">مطعم وقت الصحة | Healthy Time</h1>
        <p>نظام إدارة وطباعة بطاقات السعرات</p>
      </div>
      <div class="top-actions">
        <button id="langToggle" class="btn secondary">English</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-page="entryPage">تعبئة السعرات</button>
      <button class="tab" data-page="cardsPage">بطاقات السعرات</button>
      <button class="tab" data-page="productsPage">إدارة المنتجات</button>
      <button class="tab" data-page="settingsPage">الإعدادات</button>
    </nav>

    <main>
      <section id="entryPage" class="page active">
        <div class="card">
          <h2>صفحة تعبئة السعرات</h2>
          <form id="productForm" class="grid">
            <input type="hidden" id="productId" />
            <label>اسم المنتج بالعربي<input id="nameAr" required /></label>
            <label>Product Name (English)<input id="nameEn" required /></label>
            <label>التصنيف<input id="category" placeholder="ساندويتشات" required /></label>
            <label>السعرات kcal<input id="kcal" type="number" min="0" required /></label>
            <label>البروتين g<input id="protein" type="number" step="0.1" required /></label>
            <label>الكربوهيدرات g<input id="carbs" type="number" step="0.1" required /></label>
            <label>الدهون g<input id="fat" type="number" step="0.1" required /></label>
            <label>الألياف g<input id="fiber" type="number" step="0.1" required /></label>
            <label class="full">حجم الحصة<input id="servingSize" placeholder="3/2 كوب (55 غرام)" required /></label>
            <label class="full">ملاحظات<textarea id="notes" rows="2"></textarea></label>
            <div class="full actions">
              <button class="btn" type="submit">حفظ المنتج</button>
              <button class="btn secondary" type="button" id="formReset">تفريغ</button>
            </div>
          </form>
        </div>
      </section>

      <section id="cardsPage" class="page">
        <div class="card">
          <h2>بطاقة السعرات + الطباعة</h2>
          <div class="grid">
            <label>اختر المنتج<select id="labelProduct"></select></label>
            <label>عدد النسخ<input id="copies" type="number" value="1" min="1" /></label>
            <label>قالب البطاقة
              <select id="cardStyle">
                <option value="classic">Classic (مثل الصورة)</option>
                <option value="clean">Clean</option>
                <option value="bold">Bold</option>
              </select>
            </label>
            <label>Batch<input id="batch" placeholder="B-100" /></label>
            <label>Production<input id="production" type="date" /></label>
            <label>Expiry<input id="expiry" type="date" /></label>
          </div>
          <div class="actions">
            <button class="btn" id="saveLabel">حفظ البطاقة</button>
            <button class="btn" id="printOne">طباعة البطاقة</button>
            <button class="btn" id="printBulk">طباعة عدة بطاقات A4</button>
          </div>
          <div id="labelPreview" class="label-preview"></div>
        </div>

        <div class="card">
          <h3>البطاقات المحفوظة</h3>
          <div id="historyList"></div>
        </div>
      </section>

      <section id="productsPage" class="page">
        <div class="card">
          <h2>صفحة إدارة المنتجات (تعديل / حذف)</h2>
          <div class="search-row">
            <input id="searchInput" placeholder="ابحث بالاسم أو التصنيف" />
            <select id="categoryFilter"><option value="">كل التصنيفات</option></select>
          </div>
          <div id="productsTableWrap"></div>
        </div>
      </section>

      <section id="settingsPage" class="page">
        <div class="card">
          <h2>صفحة التحكم</h2>
          <form id="settingsForm" class="grid">
            <label>اسم المطعم<input id="brandName" /></label>
            <label>رابط الشعار<input id="logoUrl" placeholder="https://..." /></label>
            <label>اللون الأساسي<input id="primaryColor" type="color" value="#0f9f7a" /></label>
            <label>رابط QR<input id="qrLink" /></label>
            <label>صلاحية المستخدم
              <select id="role">
                <option value="admin">Admin</option>
                <option value="staff">Staff</option>
              </select>
            </label>
            <div class="full actions"><button class="btn" type="submit">حفظ الإعدادات</button></div>
          </form>
        </div>
      </section>
    </main>

    <template id="productsTableTemplate">
      <table>
        <thead>
          <tr>
            <th>#</th><th>المنتج</th><th>التصنيف</th><th>kcal</th><th>الحالة</th><th>إجراء</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </template>

    <script src="app.js"></script>
  </body>
</html>
